name: ABI Strategy Scanner & Telemetry Engine

on:
  schedule:
    # 11:00 AM ET (15:00 UTC) Mon-Fri
    - cron: '0 15 * * 1-5'
    # 12:30 PM ET (16:30 UTC) Mon-Fri
    - cron: '30 16 * * 1-5'
    # 2:00 PM ET (18:00 UTC) Mon-Fri
    - cron: '0 18 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Number of historical days to backfill (0 to disable)'
        required: true
        default: '30'
        type: choice
        options:
          - '0'
          - '7'
          - '14'
          - '30'
          - '90'
          - '180'
          - '365'

permissions:
  contents: write

# Top-level concurrency block: Prevents overlapping pushes and Pages deployment collisions
concurrency:
  group: abi-telemetry-scanner
  cancel-in-progress: false

jobs:
  run-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy lxml html5lib

      - name: Execute Full Universe Scanner & Prune Old Data
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BACKFILL="${{ github.event.inputs.backfill_days }}"
          else
            BACKFILL="0"
          fi
          
          echo "Running scanner with --backfill $BACKFILL"
          if [ "$BACKFILL" -gt 0 ]; then
            python engine/scanner.py --backfill "$BACKFILL"
          else
            python engine/scanner.py
          fi

      - name: Commit and Push Updated Telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "No telemetry changes detected."
          else
            git commit -m "chore(telemetry): scan & backfill update [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            # Discard any stray artifacts outside data/ so the worktree is pristine for rebase
            git checkout -- .
            git clean -fd
            git pull --rebase origin main
            git push origin main
          fi
