name: ABI Strategy Scanner & Telemetry Engine

on:
  schedule:
    # 05:45 MST (12:45 UTC) Mon-Fri: Pre-market refresh (before 06:15 MST Spark scan)
    - cron: '45 12 * * 1-5'
    # Hourly during active US market trading (09:30 AM - 04:30 PM EDT / 13:30 - 20:30 UTC Mon-Fri)
    - cron: '30 13-20 * * 1-5'
    # 17:00 EDT (21:00 UTC) Mon-Fri: Official Post-Market Close & Prune
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Allows manual one-click scan from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy lxml html5lib

      - name: Execute Full Universe Scanner & Prune Old Data
        run: |
          python engine/scanner.py

      - name: Commit and Push Updated Telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "No telemetry changes detected."
          else
            git commit -m "chore(telemetry): hourly active market scan & retention prune [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
